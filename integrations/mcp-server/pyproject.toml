[project]
name = "pencil-in-the-loop-mcp"
version = "0.1.0"
description = "Local MCP server for the Pencil-in-the-loop iPad reader: send documents to the iPad, read Pencil reviews back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<3"]

# Starlette and uvicorn are needed only to *host* the relay. The stdio install
# — what `claude mcp add` launches on a Mac — stays as light as it was, so
# `uvx --from . pencil-in-the-loop-mcp` pulls nothing new.
[project.optional-dependencies]
relay = ["starlette>=0.37", "uvicorn>=0.30"]

[project.scripts]
pencil-in-the-loop-mcp = "pencil_in_the_loop_mcp.server:main"
pencil-loop-relay = "pencil_in_the_loop_mcp.relay.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pencil_in_the_loop_mcp"]
