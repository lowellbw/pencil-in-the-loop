[project]
name = "pencil-in-the-loop-mcp"
version = "0.1.0"
description = "Local MCP server for the Pencil-in-the-loop iPad reader: send documents to the iPad, read Pencil reviews back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.2,<3"]

[project.scripts]
pencil-in-the-loop-mcp = "pencil_in_the_loop_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pencil_in_the_loop_mcp"]
